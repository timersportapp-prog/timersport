<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>TimerSport</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100vh;width:100%;background:#0B0B0B;display:flex;justify-content:center}
#root{width:100%;max-width:500px;margin:0 auto}
body{color:#fff;font-family:"Rajdhani",sans-serif;overflow-x:hidden}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:#FF6A00;border-radius:2px}
button{font-family:"Rajdhani",sans-serif;cursor:pointer;border:none;outline:none;transition:transform 0.2s}
button:active{transform:scale(0.97)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes countPop{0%{transform:scale(0.2);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes ringShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback}=React;

/* ============================================================
   ASSETS depuis GitHub — aucun base64, fichier léger
   ============================================================ */
const BASE="https://raw.githubusercontent.com/timersportapp-prog/timersport/main";
const ASSETS={
  bell:   BASE+"/bell.wav",
  boxer:  BASE+"/boxer.png?v=3",
  ring:   BASE+"/ring.png?v=3",
  hiit:   BASE+"/hiit.png?v=3",
  chrono: BASE+"/chrono.png?v=3",
};

/* ============================================================
   AUDIO — chargé uniquement quand nécessaire
   ============================================================ */
let _bell=null;
function getBell(){
  if(!_bell){_bell=new Audio(ASSETS.bell);_bell.preload="auto";}
  return _bell;
}
function playBell(){
  try{const a=getBell();a.currentTime=0;a.play().catch(()=>{});}catch(e){}
}
function unlockAudio(){try{getBell().load();}catch(e){}}
function playBip(freq,dur,vol){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type="sine";o.frequency.value=freq||1000;
    g.gain.setValueAtTime(vol||0.5,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+(dur||0.1));
    o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+(dur||0.1)+0.05);
  }catch(e){}
}
function playMid(){playBip(880,0.5,0.25);}
function playCount(n){playBip({3:550,2:700,1:950}[n]||800,0.18,0.7);}
const vib=(p)=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
const fmt=(s)=>`${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
const fmtMs=(ms)=>{
  const m=Math.floor(ms/60000),s=Math.floor((ms%60000)/1000),cs=Math.floor((ms%1000)/10);
  return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}.${String(cs).padStart(2,"0")}`;
};

/* DATA */
const PHASES={
  rounds:{w:"ROUND",r:"CORNER"},
  fractionne:{w:"SPRINT",r:"RÉCUP"},
  hiit:{w:"EFFORT",r:"REPOS"},
  endurance:{w:"EFFORT",r:"REPOS"},
};
const getCals=(w,re,ro)=>Math.round(((w+re)*ro/60)*8);
const getDur=(w,re,ro)=>{const t=(w+re)*ro;return `${String(Math.floor(t/60)).padStart(2,"0")}:${String(t%60).padStart(2,"0")}`;};
const getRecov=(w,ro)=>{const m=(w*ro)/60;if(m>20)return"Ton corps a besoin de repos. Hydrate-toi et reviens encore plus fort !";if(m>10)return"Bonne séance ! Récupération active conseillée.";return"Séance légère ! Tu peux t'entraîner demain.";};
const ADS=[{brand:"SportMax Pro",msg:"Équipement performance — Livraison express 24h"},{brand:"FitZone",msg:"Nutrition sportive — Code FZ15 = -15%"},{brand:"AthleteCore",msg:"Suppléments certifiés — Qualité olympique"}];
function saveS(s){try{const h=JSON.parse(localStorage.getItem("ts_h")||"[]");h.unshift({...s,date:new Date().toLocaleDateString("fr-FR"),time:new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})});localStorage.setItem("ts_h",JSON.stringify(h.slice(0,50)));}catch(e){}}
function getH(){try{return JSON.parse(localStorage.getItem("ts_h")||"[]");}catch(e){return[];}}
function saveLast(m,c){try{localStorage.setItem("ts_last",JSON.stringify({mode:m,cfg:c}));}catch(e){}}
function getLast(){try{return JSON.parse(localStorage.getItem("ts_last"));}catch(e){return null;}}

/* COMPOSANTS */
function AdBanner(){
  const ad=ADS[Math.floor(Math.random()*ADS.length)];
  return(
    <div style={{background:"#151515",borderRadius:12,padding:"10px 14px",display:"flex",alignItems:"center",gap:10,border:"1px solid #1f1f1f",position:"relative"}}>
      <span style={{fontSize:8,color:"#444",position:"absolute",top:3,left:6}}>PUB</span>
      <div style={{width:40,height:40,borderRadius:8,background:"#1f1f1f",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}}>💪</div>
      <div style={{flex:1}}><div style={{fontSize:13,fontWeight:700,color:"#FF8C00"}}>{ad.brand}</div><div style={{fontSize:11,color:"#555"}}>{ad.msg}</div></div>
      <div style={{background:"linear-gradient(135deg,#FF6A00,#FF3C00)",borderRadius:8,padding:"6px 12px",fontSize:11,color:"#fff",fontWeight:700,flexShrink:0}}>Découvrir ›</div>
    </div>
  );
}

function NumCtrl({label,icon,value,onChange,min,max,unit}){
  const iv=useRef(null),t1=useRef(null),t2=useRef(null),t3=useRef(null);
  const stop=()=>{clearInterval(iv.current);clearTimeout(t1.current);clearTimeout(t2.current);clearTimeout(t3.current);};
  useEffect(()=>()=>stop(),[]);
  const press=(dir)=>{
    onChange(v=>Math.min(max,Math.max(min,v+dir)));
    t1.current=setTimeout(()=>{
      iv.current=setInterval(()=>onChange(v=>Math.min(max,Math.max(min,v+dir))),100);
      t2.current=setTimeout(()=>{
        clearInterval(iv.current);
        iv.current=setInterval(()=>onChange(v=>Math.min(max,Math.max(min,v+dir*5))),50);
        t3.current=setTimeout(()=>{clearInterval(iv.current);iv.current=setInterval(()=>onChange(v=>Math.min(max,Math.max(min,v+dir*15))),30);},2000);
      },1500);
    },500);
  };
  const BS={width:56,height:56,borderRadius:"50%",background:"transparent",border:"2px solid #FF6A00",color:"#FF6A00",fontSize:30,display:"flex",alignItems:"center",justifyContent:"center",touchAction:"none",userSelect:"none"};
  return(
    <div style={{background:"#141414",borderRadius:16,padding:"18px 20px",border:"1px solid #1f1f1f",marginBottom:12}}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14}}>
        <span style={{fontSize:20}}>{icon}</span>
        <span style={{fontSize:12,color:"#777",letterSpacing:2,fontWeight:700}}>{label}</span>
      </div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <button style={BS} onMouseDown={e=>{e.preventDefault();press(-1);}} onMouseUp={stop} onMouseLeave={stop} onTouchStart={e=>{e.preventDefault();press(-1);}} onTouchEnd={e=>{e.preventDefault();stop();}} onTouchCancel={e=>{e.preventDefault();stop();}}>−</button>
        <div style={{textAlign:"center"}}><span style={{fontFamily:"Oswald",fontSize:60,fontWeight:700,color:"#fff"}}>{value}</span><span style={{fontSize:18,color:"#888",marginLeft:4}}>{unit}</span></div>
        <button style={BS} onMouseDown={e=>{e.preventDefault();press(1);}} onMouseUp={stop} onMouseLeave={stop} onTouchStart={e=>{e.preventDefault();press(1);}} onTouchEnd={e=>{e.preventDefault();stop();}} onTouchCancel={e=>{e.preventDefault();stop();}}>+</button>
      </div>
      <div style={{height:2,background:"linear-gradient(90deg,#FF6A00,#FF3C00)",borderRadius:1,marginTop:14,opacity:0.5}}/>
    </div>
  );
}

function ChronoLibre({onBack,muted}){
  const [ms,setMs]=useState(0);const [running,setRunning]=useState(false);const [laps,setLaps]=useState([]);
  const sRef=useRef(null),aRef=useRef(0),rRef=useRef(null);
  const tick=useCallback(()=>{setMs(aRef.current+(Date.now()-sRef.current));rRef.current=requestAnimationFrame(tick);},[]);
  const start=()=>{sRef.current=Date.now();setRunning(true);rRef.current=requestAnimationFrame(tick);vib([60]);};
  const pause=()=>{aRef.current+=(Date.now()-sRef.current);cancelAnimationFrame(rRef.current);setRunning(false);vib([40]);};
  const reset=()=>{cancelAnimationFrame(rRef.current);aRef.current=0;setMs(0);setRunning(false);setLaps([]);};
  const lap=()=>{const cur=aRef.current+(running?Date.now()-sRef.current:0);const prev=laps.length>0?laps[laps.length-1].total:0;setLaps(l=>[...l,{n:l.length+1,split:cur-prev,total:cur}]);if(!muted)playBip(660,0.08,0.3);vib([30]);};
  useEffect(()=>()=>cancelAnimationFrame(rRef.current),[]);
  const m=Math.floor(ms/60000),s=Math.floor((ms%60000)/1000),cs=Math.floor((ms%1000)/10);
  return(
    <div style={{minHeight:"100vh",background:"#0B0B0B",display:"flex",flexDirection:"column"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"16px 20px",borderBottom:"1px solid #151515"}}>
        <button onClick={onBack} style={{background:"transparent",color:"#FF6A00",fontSize:22}}>←</button>
        <span style={{fontFamily:"Oswald",fontSize:18,fontWeight:700}}><span style={{color:"#fff"}}>Timer</span><span style={{color:"#FF6A00"}}>Sport</span></span>
        <div style={{width:30}}/>
      </div>
      <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",padding:"30px 20px"}}>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:40}}>
          <div style={{height:2,width:40,background:"linear-gradient(90deg,transparent,#FF6A00)"}}/>
          <span style={{fontFamily:"Oswald",fontSize:22,fontWeight:700,color:"#FF6A00",letterSpacing:3}}>CHRONO LIBRE</span>
          <div style={{height:2,width:40,background:"linear-gradient(90deg,#FF6A00,transparent)"}}/>
        </div>
        <div style={{textAlign:"center",marginBottom:40}}>
          <div style={{fontFamily:"Oswald",fontWeight:700,fontSize:80,color:"#fff",lineHeight:1,textShadow:running?"0 0 40px rgba(255,106,0,0.7)":"none",animation:running?"pulse 1s ease-in-out infinite":undefined}}>
            {String(m).padStart(2,"0")}:{String(s).padStart(2,"0")}
          </div>
          <div style={{fontFamily:"Oswald",fontSize:40,color:"#FF8C00",fontWeight:600}}>.{String(cs).padStart(2,"0")}</div>
          <div style={{fontSize:11,color:"#333",marginTop:8,letterSpacing:3}}>MM:SS.CS</div>
        </div>
        <div style={{width:"100%",maxWidth:420,display:"flex",flexDirection:"column",gap:12}}>
          {!running?(<button onClick={start} style={{padding:"18px",borderRadius:16,background:"linear-gradient(135deg,#FF6A00,#FF3C00)",fontFamily:"Oswald",fontSize:20,fontWeight:700,color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",gap:10,boxShadow:"0 4px 20px rgba(255,106,0,0.35)"}}>▶ {ms===0?"DÉMARRER":"REPRENDRE"}</button>
          ):(<button onClick={pause} style={{padding:"18px",borderRadius:16,border:"2px solid #FF6A00",background:"transparent",fontFamily:"Oswald",fontSize:20,fontWeight:700,color:"#FF6A00",display:"flex",alignItems:"center",justifyContent:"center",gap:10}}>⏸ PAUSE</button>)}
          <div style={{display:"flex",gap:12}}>
            <button onClick={lap} disabled={ms===0} style={{flex:1,padding:"16px",borderRadius:14,background:"#151515",border:"1px solid #222",color:ms>0?"#fff":"#333",fontFamily:"Oswald",fontSize:16,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>🏁 TOUR</button>
            <button onClick={reset} style={{flex:1,padding:"16px",borderRadius:14,background:"#151515",border:"1px solid #222",color:"#666",fontFamily:"Oswald",fontSize:16,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>↺ RESET</button>
          </div>
        </div>
        {laps.length>0&&(
          <div style={{width:"100%",maxWidth:420,marginTop:20,background:"#141414",borderRadius:14,border:"1px solid #1f1f1f",overflow:"hidden"}}>
            <div style={{padding:"10px 16px",borderBottom:"1px solid #1f1f1f",display:"flex",justifyContent:"space-between"}}>
              <span style={{fontSize:11,color:"#444",letterSpacing:2}}>TOUR</span><span style={{fontSize:11,color:"#444",letterSpacing:2}}>SPLIT</span><span style={{fontSize:11,color:"#444",letterSpacing:2}}>TOTAL</span>
            </div>
            <div style={{maxHeight:200,overflowY:"auto"}}>
              {[...laps].reverse().map(l=>(<div key={l.n} style={{padding:"10px 16px",borderBottom:"1px solid #111",display:"flex",justifyContent:"space-between",alignItems:"center"}}><span style={{fontFamily:"Oswald",fontSize:15,color:"#FF8C00"}}>#{l.n}</span><span style={{fontFamily:"Oswald",fontSize:14,color:"#fff"}}>{fmtMs(l.split)}</span><span style={{fontFamily:"Oswald",fontSize:13,color:"#555"}}>{fmtMs(l.total)}</span></div>))}
            </div>
          </div>
        )}
      </div>
      <div style={{padding:"0 20px 20px"}}><AdBanner/></div>
    </div>
  );
}

function HistoScreen(){
  const history=getH();
  const icons={rounds:"🥊",fractionne:"🏃",hiit:"🔥",endurance:"🎯",libre:"⏱️"};
  return(
    <div style={{padding:"20px"}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:6}}><span style={{fontSize:22}}>📊</span><span style={{fontFamily:"Oswald",fontSize:26,fontWeight:700,color:"#fff"}}>HISTORIQUE</span></div>
      <p style={{fontSize:13,color:"#666",marginBottom:24}}>Retrouve toutes tes sessions passées</p>
      {history.length===0?(
        <div style={{textAlign:"center",padding:"60px 0"}}><div style={{fontSize:52,marginBottom:16}}>📭</div><div style={{fontFamily:"Oswald",fontSize:20,color:"#333"}}>Aucune session pour l'instant</div><div style={{fontSize:13,color:"#222",marginTop:8}}>Lance ton premier entraînement !</div></div>
      ):(
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          {history.map((h,i)=>(
            <div key={i} style={{background:"#141414",borderRadius:16,padding:"16px",border:"1px solid #1f1f1f",display:"flex",alignItems:"center",gap:14,borderLeft:"3px solid #FF6A00",animation:"fadeIn 0.3s ease"}}>
              <div style={{width:48,height:48,borderRadius:12,background:"#1f1f1f",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0}}>{icons[h.mode]||"🏃"}</div>
              <div style={{flex:1}}><div style={{fontFamily:"Oswald",fontSize:17,fontWeight:600,color:"#fff"}}>{h.modeName||h.mode}</div><div style={{fontSize:12,color:"#555"}}>{h.date} à {h.time}</div></div>
              <div style={{display:"flex",gap:16}}>
                <div style={{textAlign:"center"}}><div style={{fontSize:10,color:"#555"}}>⏱</div><div style={{fontFamily:"Oswald",fontSize:16,color:"#FF8C00"}}>{h.duration||"--"}</div></div>
                <div style={{textAlign:"center"}}><div style={{fontSize:10,color:"#555"}}>🔥</div><div style={{fontFamily:"Oswald",fontSize:16,color:"#FF6A00"}}>{h.calories||"--"}</div></div>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function NavBar({screen,setScreen,onStart}){
  const last=getLast();
  return(
    <div style={{position:"fixed",bottom:0,left:0,right:0,background:"#0D0D0D",borderTop:"1px solid #151515",display:"flex",alignItems:"center",height:72,zIndex:100,maxWidth:500,margin:"0 auto",left:"50%",transform:"translateX(-50%)",width:"100%"}}>
      {[{id:"home",icon:"🏠",label:"Accueil"},{id:"history",icon:"📊",label:"Historique"}].map(t=>(
        <button key={t.id} onClick={()=>setScreen(t.id)} style={{flex:1,padding:"8px 0",background:"transparent",display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
          <span style={{fontSize:20}}>{t.icon}</span>
          <span style={{fontSize:9,color:screen===t.id?"#FF6A00":"#444",fontWeight:screen===t.id?700:400,letterSpacing:0.5}}>{t.label}</span>
        </button>
      ))}
      <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center"}}>
        <button onClick={()=>{const l=getLast();if(l&&onStart)onStart(l.cfg,l.mode,{name:l.mode});}}
          style={{width:58,height:58,borderRadius:"50%",background:last?"linear-gradient(135deg,#FF6A00,#FF3C00)":"#1a1a1a",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:last?"0 0 20px rgba(255,106,0,0.5)":"none",transform:"translateY(-20px)",border:"3px solid #0D0D0D",fontSize:22}}>▶</button>
        <span style={{fontSize:9,color:"#FF6A00",fontWeight:700,letterSpacing:1,marginTop:-16}}>START RAPIDE</span>
      </div>
      {[{id:"obj",icon:"🏆",label:"Objectifs"},{id:"set",icon:"⚙️",label:"Réglages"}].map(t=>(
        <button key={t.id} style={{flex:1,padding:"8px 0",background:"transparent",display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
          <span style={{fontSize:20}}>{t.icon}</span>
          <span style={{fontSize:9,color:"#444",letterSpacing:0.5}}>{t.label}</span>
        </button>
      ))}
    </div>
  );
}

function App(){
  const [screen,setScreen]=useState("home");
  const [mode,setMode]=useState("rounds");
  const [cfg,setCfg]=useState({work:180,rest:60,rounds:8});
  const [ts,setTs]=useState({running:false,phase:"ROUND",cur:0,total:0,round:1,done:false});
  const [muted,setMuted]=useState(false);
  const [showBilan,setShowBilan]=useState(false);
  const [adCd,setAdCd]=useState(3);
  const [countdown,setCountdown]=useState(0);
  const [stats,setStats]=useState(null);
  const [bellAnim,setBellAnim]=useState(false);
  const ivRef=useRef(null),bip3=useRef(false),midFired=useRef(false),wlRef=useRef(null);
  const tw=useRef(0),tr=useRef(0);
  const mutedRef=useRef(muted);mutedRef.current=muted;
  const modeRef=useRef(mode);modeRef.current=mode;
  const cfgRef=useRef(cfg);cfgRef.current=cfg;
  const presetRef=useRef(null);

  const bell=useCallback(()=>{setBellAnim(true);setTimeout(()=>setBellAnim(false),500);},[]);

  const startTimer=useCallback((config,md,preset)=>{
    unlockAudio();setMode(md);setCfg(config);
    cfgRef.current=config;modeRef.current=md;
    midFired.current=false;tw.current=0;tr.current=0;
    presetRef.current=preset||null;saveLast(md,config);
    setCountdown(3);setScreen("countdown");
  },[]);

  useEffect(()=>{
    if(countdown<=0)return;
    if(!mutedRef.current)playCount(countdown);vib([70]);
    if(countdown===1){
      const t=setTimeout(()=>{
        setCountdown(0);const wn=PHASES[modeRef.current]?.w||"ROUND";const c=cfgRef.current;
        setTs({running:true,phase:wn,cur:c.work,total:c.work,round:1,done:false});
        bip3.current=false;setScreen("timer");
        if(!mutedRef.current){playBell();bell();}vib([400]);
        try{navigator.wakeLock?.request("screen").then(w=>wlRef.current=w).catch(()=>{});}catch(e){}
      },1000);return()=>clearTimeout(t);
    }
    const t=setTimeout(()=>setCountdown(c=>c-1),1000);return()=>clearTimeout(t);
  },[countdown,bell]);

  useEffect(()=>{
    if(!ts.running||ts.done)return;
    const md=modeRef.current,c=cfgRef.current;
    const wn=PHASES[md]?.w||"ROUND",rn=PHASES[md]?.r||"REPOS";
    ivRef.current=setInterval(()=>{
      setTs(prev=>{
        if(!prev.running||prev.done)return prev;
        const next=prev.cur-1;const isWork=prev.phase===wn;
        if(isWork)tw.current+=1;else tr.current+=1;
        const half=Math.floor((c.work*c.rounds)/2);
        if(isWork&&tw.current===half&&!midFired.current){midFired.current=true;if(!mutedRef.current)playMid();vib([80,50,80]);}
        if(next===3&&!bip3.current&&isWork){
          bip3.current=true;
          if(!mutedRef.current){playBip(1300,0.13,0.6);setTimeout(()=>playBip(1300,0.13,0.6),160);setTimeout(()=>playBip(1300,0.13,0.6),320);}
          vib([70,50,70,50,70,50]);
        }
        if(next<=0){
          const doEnd=()=>{
            if(!mutedRef.current){playBell();bell();}vib([600,100,600]);clearInterval(ivRef.current);
            const s={totalWork:tw.current,totalRest:tr.current,rounds:c.rounds,calories:getCals(c.work,c.rest,c.rounds),duration:getDur(c.work,c.rest,c.rounds),recov:getRecov(c.work,c.rounds),mode:modeRef.current,modeName:presetRef.current?.name||modeRef.current};
            saveS(s);setTimeout(()=>{setStats(s);setShowBilan(true);setAdCd(3);},900);
            return{...prev,cur:0,done:true,running:false,phase:"TERMINÉ"};
          };
          if(isWork){
            if(prev.round>=c.rounds)return doEnd();
            if(!mutedRef.current){playBell();bell();}vib([300,80,300]);bip3.current=false;
            return{...prev,phase:rn,cur:c.rest,total:c.rest};
          }else{
            const nr=prev.round+1;if(nr>c.rounds)return doEnd();
            if(!mutedRef.current){playBell();bell();}vib([300]);bip3.current=false;
            return{...prev,phase:wn,cur:c.work,total:c.work,round:nr};
          }
        }
        return{...prev,cur:next};
      });
    },1000);return()=>clearInterval(ivRef.current);
  },[ts.running,ts.done,bell]);

          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <span style={{fontSize:16}}>🎯</span>
            <span style={{fontFamily:"Oswald",fontSize:11,color:"#FF6A00",letterSpacing:3,fontWeight:700}}>MODES PERSONNALISÉS</span>
          </div>
          <div style={{border:"1px solid #FF6A0044",borderRadius:20,
            padding:"5px 14px",fontSize:11,color:"#FF6A00",fontWeight:600}}>+ CRÉER</div>
        </div>

        {/* ===== CARDS MODES ===== */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:8,marginBottom:16}}>
          {[
            {img:ASSETS.ring,icon:"🥊",name:"Rounds",desc:"Boxe • MMA\nArts martiaux",
              action:()=>{setMode("rounds");setCfg({work:180,rest:60,rounds:8});setScreen("config");}},
            {img:ASSETS.hiit,icon:"💪",name:"HIIT\nCustom",desc:"Entraînement\nsur mesure",
              action:()=>{setMode("hiit");setCfg({work:40,rest:20,rounds:6});setScreen("config");}},
            {img:ASSETS.chrono,icon:"⏱️",name:"Chrono\nLibre",desc:"Chronomètre\nprécis avec tours",
              action:()=>setScreen("libre")},
            {img:null,icon:"+",name:"",desc:"",
              action:()=>{setMode("rounds");setCfg({work:60,rest:30,rounds:5});setScreen("config");}},
          ].map((card,i)=>(
            <button key={i} onClick={card.action}
              style={{borderRadius:16,overflow:"hidden",
                border:i===3?"1px dashed rgba(255,106,0,0.4)":"1px solid #222",
                background:i===3?"transparent":"#141414",
                display:"flex",flexDirection:"column",padding:0,textAlign:"left"}}>
              {card.img?(
                <div style={{height:100,position:"relative",overflow:"hidden",background:"#1a1a1a"}}>
                  <img src={card.img} alt={card.name}
                    style={{width:"100%",height:"100%",objectFit:"cover"}}
                    onError={e=>e.target.style.opacity="0"}/>
                  <div style={{position:"absolute",inset:0,
                    background:"linear-gradient(to bottom,rgba(0,0,0,0.1),rgba(0,0,0,0.6))"}}/>
                  <div style={{position:"absolute",top:7,left:7,width:28,height:28,
                    borderRadius:8,background:"linear-gradient(135deg,#FF6A00,#FF3C00)",
                    display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,
                    boxShadow:"0 2px 8px rgba(255,60,0,0.4)"}}>
                    {card.icon}
                  </div>
                </div>
              ):(
                <div style={{height:100,display:"flex",flexDirection:"column",
                  alignItems:"center",justifyContent:"center",gap:4}}>
                  <span style={{fontSize:30,color:"#FF6A00"}}>+</span>
                  <span style={{fontSize:9,color:"#FF6A00",textAlign:"center",lineHeight:1.3,
                    fontFamily:"Oswald",fontWeight:600}}>Créer un{"\n"}entraînement</span>
                </div>
              )}
              {card.name&&(
                <div style={{padding:"8px 8px 10px"}}>
                  <div style={{fontFamily:"Oswald",fontSize:12,fontWeight:700,
                    color:"#fff",whiteSpace:"pre-line",lineHeight:1.2}}>{card.name}</div>
                  {card.desc&&(
                    <div style={{fontSize:9,color:"#555",marginTop:3,
                      whiteSpace:"pre-line",lineHeight:1.3}}>{card.desc}</div>
                  )}
                  <div style={{fontSize:9,color:"#FF6A00",marginTop:4,
                    display:"flex",alignItems:"center",gap:3}}>
                    <span>★</span><span>PERSONNALISÉ</span>
                  </div>
                </div>
              )}
            </button>
          ))}
        </div>

      </div>

      {/* PUB fixe */}
      <div style={{position:"fixed",bottom:72,left:"50%",transform:"translateX(-50%)",
        width:"100%",maxWidth:500,
        padding:"8px 16px",
        background:"rgba(11,11,11,0.97)",
        borderTop:"1px solid #1a1a1a",zIndex:50}}>
        <AdBanner/>
      </div>

      <NavBar screen={screen} setScreen={setScreen} onStart={startTimer}/>
    </div>
  );
}

/* ✅ CORRECTION REACT 18 — createRoot obligatoire */
const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
